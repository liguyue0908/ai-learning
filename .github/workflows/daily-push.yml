name: AI 学习每日推送（手动备用）

on:
  workflow_dispatch:  # 仅手动触发，不定时

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Push daily content
        env:
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PAGES_URL: https://liguyue0908.github.io/ai-learning
        run: python3 generate.py
