name: AI 学习每日推送（备胎）

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 北京时间 9:00（备胎）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Push daily content
        env:
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PAGES_URL: https://liguyue0908.github.io/ai-learning
        run: python3 generate.py
