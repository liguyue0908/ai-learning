name: AI 学习每日推送

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

# 需要写入权限来部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and push
        env:
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PAGES_URL: https://liguyue0908.github.io/ai-learning
        run: python3 generate.py
